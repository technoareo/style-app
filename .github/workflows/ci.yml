name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run verify:packaging
      # Starts the built standalone bundle from an isolated copy with no
      # ancestor node_modules and exercises sign-up, mail capture, verification,
      # sign-in, wardrobe, photo upload (sharp) and the analysis routes.
      - run: npm run verify:standalone
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Build 008. Builds the real image and runs app + AI worker + mail worker in
  # containers against a MOCK model (no model download, no real AI, no real
  # email, no external accounts). Written but not yet run by the author: the
  # first run on a Docker host is part of the launch evidence.
  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: docker build -t style-studio:ci .
      - name: Start mock model, app, AI worker and mail worker
        run: |
          set -eu
          data="$RUNNER_TEMP/style-data"
          mkdir -p "$data" && chmod 777 "$data"
          docker network create style-ci
          docker run -d --name mock-ollama --network style-ci \
            -v "$PWD/deploy/ci/mock-ollama.mjs:/mock.mjs:ro" \
            node:24-bookworm-slim node /mock.mjs
          common="--network style-ci -v $data:/data -e STYLE_DATA_DIR=/data -e OLLAMA_URL=http://mock-ollama:11434 -e APP_URL=http://127.0.0.1:3000"
          docker run -d --name app $common -p 127.0.0.1:3000:3000 style-studio:ci \
            sh -c "./node_modules/.bin/tsx scripts/init-auth.ts && node server.js"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/api/health
          docker run -d --name worker $common style-studio:ci \
            ./node_modules/.bin/tsx scripts/analysis-worker.ts
          docker run -d --name mailer $common style-studio:ci \
            ./node_modules/.bin/tsx scripts/mail-worker.ts
      - name: Smoke test through the containers
        run: BASE_URL=http://127.0.0.1:3000 STYLE_DATA_DIR="$RUNNER_TEMP/style-data" npx tsx scripts/ci-docker-smoke.ts
      # Build 022. Encrypted backup TRANSFER and FRESH RESTORE drill against the
      # real built image (style-studio:ci) and the real backup:encrypted /
      # restore:encrypted commands, on isolated named volumes. No model, no AI
      # worker. The passphrase is generated in the script, never logged, and held
      # on its own volume. The script removes its own containers, volumes and
      # files in a finally block; the step after it sweeps by label as well.
      - name: Encrypted backup transfer and fresh restore drill
        timeout-minutes: 15
        run: npx tsx scripts/ci-backup-drill.ts
        env:
          IMAGE: style-studio:ci
          DRILL_PORT: "3100"
      - name: Drill cleanup sweep
        if: always()
        run: npx tsx scripts/ci-backup-drill.ts --cleanup-only
      - name: Container logs (no secrets, tokens or bodies are logged by the app)
        if: always()
        run: |
          for c in app worker mailer mock-ollama; do
            echo "=== $c ==="; docker logs --tail 60 "$c" 2>&1 || true
          done
      - name: Clean up
        if: always()
        run: |
          docker rm -f app worker mailer mock-ollama 2>/dev/null || true
          docker network rm style-ci 2>/dev/null || true
