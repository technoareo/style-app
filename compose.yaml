services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      STYLE_PUBLIC_DEPLOYMENT: "true"
      STYLE_DATA_DIR: /data
      OLLAMA_URL: http://ollama:11434
      # Starting values, NOT measured capacity and not yet run in Docker.
      # Override in .env.production (STYLE_* names are in docs/DEPLOYMENT.md).
      NODE_OPTIONS: --max-old-space-size=768
      # Build 017 (AUTHORED, NOT RUN): the ONE place the upload-body deadline is
      # set. Compose fills it from the project variable STYLE_BODY_READ_TIMEOUT_MS
      # in the project `.env` next to this file (shell and --env-file also work)
      # and the proxy gets the same expression and derives its own cap from it,
      # so the two cannot drift apart. It is handed to the container under a
      # DIFFERENT name on purpose: the application's own STYLE_BODY_READ_TIMEOUT_MS
      # is then set by the start command below, which first refuses to start if
      # .env.production still carries that name (fail closed; nothing else starts,
      # because everything waits for this service to be healthy).
      STYLE_COMPOSE_BODY_READ_TIMEOUT_MS: ${STYLE_BODY_READ_TIMEOUT_MS:-20000}
    # Starting memory ceiling for the web process; size from the target-server
    # load test. Untested here because Docker is unavailable.
    mem_limit: 1536m
    volumes:
      - app-data:/data
    expose:
      - "3000"
    depends_on:
      - ollama
    # Build 017 guard (AUTHORED, NOT RUN). Two refusals, both before anything
    # starts, so the app never becomes healthy and the worker, mailer and proxy
    # (all wait for it) never start either:
    #  1. STYLE_BODY_READ_TIMEOUT_MS already present: it can only come from
    #     .env.production (the compose entry above uses another name). An old
    #     value there is no longer read, which would silently reset it to 20 s.
    #  2. The compose value must be strict: 4 to 6 digits, no leading zero, at
    #     most 120000. The application itself silently falls back to 20000 for
    #     an invalid value (src/server/limits.ts), which would differ from the
    #     proxy. The check text is identical to the proxy command's;
    #     tests/proxyConfig.test.ts keeps them identical.
    # Then the validated value is exported under the name the application reads.
    command:
      - sh
      - -c
      - 'if [ -n "$$STYLE_BODY_READ_TIMEOUT_MS" ]; then echo "STYLE_BODY_READ_TIMEOUT_MS is set in .env.production, where it is no longer read. Remove it there and set it in the project .env next to compose.yaml, see docs/DEPLOYMENT.md" >&2; exit 1; fi; case "$$STYLE_COMPOSE_BODY_READ_TIMEOUT_MS" in ""|0*|*[!0-9]*|?|??|???|???????*) bad=1;; *) bad=0;; esac; if [ "$$bad" = 1 ] || [ "$$STYLE_COMPOSE_BODY_READ_TIMEOUT_MS" -gt 120000 ]; then echo "STYLE_BODY_READ_TIMEOUT_MS must be whole milliseconds from 1000 to 120000 with no leading zero. Set it only in the project .env next to compose.yaml, see docs/DEPLOYMENT.md" >&2; exit 1; fi; STYLE_BODY_READ_TIMEOUT_MS="$$STYLE_COMPOSE_BODY_READ_TIMEOUT_MS"; export STYLE_BODY_READ_TIMEOUT_MS; ./node_modules/.bin/tsx scripts/init-auth.ts && node server.js'
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
  worker:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      STYLE_PUBLIC_DEPLOYMENT: "true"
      STYLE_DATA_DIR: /data
      OLLAMA_URL: http://ollama:11434
    volumes:
      - app-data:/data
    depends_on:
      app:
        condition: service_healthy
    command: ["./node_modules/.bin/tsx", "scripts/analysis-worker.ts"]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
  # Account mail (verification, password reset). Its own process so SMTP never
  # waits behind slow AI inference and never runs inside the web process.
  # Delivery is at-least-once. Build 009; the container has NOT been run yet.
  mailer:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      STYLE_PUBLIC_DEPLOYMENT: "true"
      STYLE_DATA_DIR: /data
      NODE_OPTIONS: --max-old-space-size=256
    mem_limit: 512m
    volumes:
      - app-data:/data
    depends_on:
      app:
        condition: service_healthy
    # `node --import tsx` (not the tsx launcher) so node itself is PID 1 and
    # receives SIGTERM directly instead of through a launcher process.
    command: ["node", "--import", "tsx", "scripts/mail-worker.ts"]
    # On SIGTERM the worker cancels the send in flight, records the message as
    # queued within a few seconds, and exits; anything still running after
    # STYLE_MAIL_SHUTDOWN_EXIT_MS (25 s) is abandoned and the row returns to
    # the queue when its lease lapses. The worst bounded shutdown work is
    # about 16.5 s with defaults (tests/mailWorker.test.ts checks that this
    # value stays above both numbers). Docker's default of 10 s is too short.
    stop_grace_period: 40s
    healthcheck:
      test:
        ["CMD", "node", "--import", "tsx", "scripts/mail-worker.ts", "--check"]
      interval: 30s
      timeout: 20s
      start_period: 60s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
  ollama:
    image: ollama/ollama:0.40.3
    restart: unless-stopped
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - model-data:/root/.ollama
    expose:
      - "11434"
  proxy:
    image: caddy:2
    restart: unless-stopped
    # Least privilege (build 015): the public proxy needs ONE value, the site
    # address read by deploy/Caddyfile as {$STYLE_DOMAIN}. It must not load
    # .env.production, which holds AUTH_SECRET and SMTP credentials.
    # Compose fills ${STYLE_DOMAIN} from the shell, from the project-level
    # `.env` next to this file (domain only: copy .env.compose.example to .env,
    # see docs/DEPLOYMENT.md), or from `--env-file`. It does NOT come from the
    # app services' env_file. The `:-` default keeps every other compose command
    # (exec, run, logs) working when it is unset, so the guard below is what
    # makes a missing value fail clearly.
    environment:
      STYLE_DOMAIN: ${STYLE_DOMAIN:-}
      # Build 017 (AUTHORED, NOT RUN): the same non-secret project variable the
      # app receives. The start command below validates it exactly as the app's
      # does and derives the Caddy body cap from it: ceil(ms / 1000) + 2 seconds
      # (20000 gives 22, 60000 gives 62, 120000 gives 122). There is no separate
      # proxy setting any more, so the two cannot be set apart.
      STYLE_COMPOSE_BODY_READ_TIMEOUT_MS: ${STYLE_BODY_READ_TIMEOUT_MS:-20000}
    # Startup guard (build 015 revision 2; AUTHORED, NOT RUN): refuse to start
    # with a clear log line when the domain is empty, instead of handing Caddy a
    # Caddyfile with no site address. `$$` is Compose's escape: the container's
    # shell expands $STYLE_DOMAIN at start, Compose does not. Build 017 adds the
    # strict check of STYLE_COMPOSE_BODY_READ_TIMEOUT_MS (4 to 6 digits, no leading zero,
    # at most 120000, so no value can overflow the shell arithmetic or be read
    # as octal) and exports STYLE_PROXY_BODY_READ_TIMEOUT_S, which
    # deploy/Caddyfile reads. A space is kept inside the arithmetic parentheses
    # so no shell reads `$(((` as a command substitution. The exec line is the
    # standard caddy:2 image command, unchanged. Assumes /bin/sh (unverified).
    command:
      - sh
      - -c
      - 'test -n "$$STYLE_DOMAIN" || { echo "STYLE_DOMAIN is not set. Copy .env.compose.example to .env and set it, see docs/DEPLOYMENT.md" >&2; exit 1; }; case "$$STYLE_COMPOSE_BODY_READ_TIMEOUT_MS" in ""|0*|*[!0-9]*|?|??|???|???????*) bad=1;; *) bad=0;; esac; if [ "$$bad" = 1 ] || [ "$$STYLE_COMPOSE_BODY_READ_TIMEOUT_MS" -gt 120000 ]; then echo "STYLE_BODY_READ_TIMEOUT_MS must be whole milliseconds from 1000 to 120000 with no leading zero. Set it only in the project .env next to compose.yaml, see docs/DEPLOYMENT.md" >&2; exit 1; fi; STYLE_PROXY_BODY_READ_TIMEOUT_S=$$(( ($$STYLE_COMPOSE_BODY_READ_TIMEOUT_MS + 999) / 1000 + 2 )); export STYLE_PROXY_BODY_READ_TIMEOUT_S; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy-data:/data
      - proxy-config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  app-data:
  model-data:
  proxy-data:
  proxy-config:
